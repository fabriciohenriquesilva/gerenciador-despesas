spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gerenciador_despesas
    username: root
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${USER_EMAIL}
    password: ${PASSWORD_EMAIL}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app.reset-password-url: http://localhost:4200/reset-password

#security
api:
  security:
    token:
      secret: abc